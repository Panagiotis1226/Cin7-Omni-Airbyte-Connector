version: 7.10.0

type: DeclarativeSource

description: >-
  This is the Cin7 Omni source that ingests data from the Cin7 Omni API.

  Cin7 Omni is a cloud-based inventory management platform. To use this source,
  you must first create an account at https://www.cin7.com/. Once logged in,
  navigate to Integrations -> API to obtain your Account ID and API Key. You can
  find more information about the API here https://api.cin7.com/api

check:
  type: CheckStream
  stream_names:
    - contacts

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: BasicHttpAuthenticator
        username: "{{ config[\"username\"] }}"
        password: "{{ config[\"api_key\"] }}"
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: rows
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: PageIncrement
          page_size: 250
          start_from_page: 1
          inject_on_first_request: true
  incremental_sync_base:
    type: DatetimeBasedCursor
    cursor_field: modifiedDate
    datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    cursor_datetime_formats:
      - "%Y-%m-%dT%H:%M:%SZ"
      - "%Y-%m-%dT%H:%M:%S.%fZ"
      - "%Y-%m-%dT%H:%M:%S%z"
      - "%Y-%m-%d"
    start_datetime:
      type: MinMaxDatetime
      datetime: "{{ config.get('start_date', '2015-01-01T00:00:00Z') }}"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    end_datetime:
      type: MinMaxDatetime
      datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
    lookback_window: P1D
  incremental_request_parameters:
    where: "modifiedDate>='{{ stream_interval.start_time }}'"
    order: modifiedDate

streams:
  - type: DeclarativeStream
    name: contacts
    retriever:
      type: SimpleRetriever
      decoder:
        type: JsonDecoder
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        url: https://api.cin7.com/api/v1/Contacts
        request_parameters:
          $ref: "#/definitions/incremental_request_parameters"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
